<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление manifest.json</title>
    <style>
        body {
            background: #f4f4f4;
            color: #000;
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #999;
            padding: 20px;
        }
        h1, h2 { text-align: center; border-bottom: 1px solid #ccc; padding-bottom: 8px; }
        .info { background: #fafafa; border: 1px solid #ddd; padding: 12px; margin: 12px 0; }
        .json-url { word-break: break-all; background: #f0f0f0; padding: 8px; border: 1px dashed #888; font-family: monospace; }
        button, .btn {
            background: #e0e0e0;
            border: 1px solid #888;
            padding: 6px 16px;
            cursor: pointer;
            text-decoration: none;
            color: #000;
        }
        button:hover, .btn:hover { background: #ccc; }
        .footer { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; text-align: center; font-size: 14px; }
        .btn-link { display: inline-block; padding: 6px 12px; background: #e0e0e0; border: 1px solid #888; text-decoration: none; color: #000; }
        .btn-link:hover { background: #ccc; }
        .hidden { display: none; }
        .success { color: #080; font-weight: bold; }
        .error { color: #c00; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 Управление manifest.json</h1>
    <p style="text-align:center;">Редактируйте файл вручную через загрузку/скачивание</p>

    <div class="info" id="statusDisplay">
        <p><strong>Текущая версия:</strong> <span id="currentVersion">—</span></p>
        <p><strong>Ссылка на прошивку:</strong> <span id="currentUrl">—</span></p>
        <p><strong>Поддерживаемые версии (eol):</strong> <span id="currentEol">—</span></p>
    </div>

    <h2>Скачать / загрузить manifest.json</h2>

    <p>
        <button id="downloadBtn">⬇ Скачать текущий manifest.json</button>
    </p>

    <form id="uploadForm" enctype="multipart/form-data">
        <p>
            <label for="fileInput">Выберите новый manifest.json:</label>
            <input type="file" id="fileInput" accept=".json">
        </p>
        <button type="submit">📤 Загрузить и обновить</button>
    </form>
    <div id="uploadMessage" class="hidden"></div>

    <p style="margin-top:15px;">
        <a href="https://yaridanet.c6t.ru/" class="btn-link">← На главную</a>
        <a href="https://yaridanet.c6t.ru/bitosupdateota/manifest.json" class="btn-link" target="_blank">🔗 Прямая ссылка на manifest.json</a>
    </p>

    <div class="footer">YaridaNet · управление manifest.json (без PHP)</div>
</div>

<script>
    (function() {
        const MANIFEST_URL = 'manifest.json?t=' + Date.now(); // добавляем параметр, чтобы избежать кеша

        // Элементы
        const currentVersion = document.getElementById('currentVersion');
        const currentUrl = document.getElementById('currentUrl');
        const currentEol = document.getElementById('currentEol');
        const downloadBtn = document.getElementById('downloadBtn');
        const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const uploadMessage = document.getElementById('uploadMessage');

        // --- Загрузка текущего manifest.json ---
        function loadManifest() {
            fetch(MANIFEST_URL)
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    currentVersion.textContent = data.version || '—';
                    currentUrl.textContent = data.url || '—';
                    currentEol.textContent = (data.eol && data.eol.length) ? data.eol.join(', ') : '—';
                })
                .catch(err => {
                    currentVersion.textContent = 'ошибка загрузки';
                    currentUrl.textContent = '—';
                    currentEol.textContent = '—';
                    console.warn('Не удалось загрузить manifest.json:', err);
                });
        }

        // --- Скачивание manifest.json ---
        function downloadManifest() {
            fetch(MANIFEST_URL)
                .then(response => response.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'manifest.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                })
                .catch(err => alert('Не удалось скачать файл: ' + err.message));
        }

        // --- Загрузка нового manifest.json ---
        uploadForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) {
                alert('Выберите файл');
                return;
            }
            if (file.name !== 'manifest.json' && file.type !== 'application/json') {
                alert('Файл должен быть manifest.json');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const json = JSON.parse(ev.target.result);
                    // Проверяем структуру (хотя бы наличие version)
                    if (!json.version) {
                        throw new Error('Нет поля version');
                    }
                } catch (err) {
                    alert('Некорректный JSON: ' + err.message);
                    return;
                }

                // Отправляем файл на сервер через fetch с FormData
                const formData = new FormData();
                formData.append('file', file);

                fetch('upload_manifest.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    uploadMessage.classList.remove('hidden');
                    if (data.success) {
                        uploadMessage.className = 'success';
                        uploadMessage.textContent = '✅ ' + data.message;
                        loadManifest(); // обновляем отображение
                    } else {
                        uploadMessage.className = 'error';
                        uploadMessage.textContent = '❌ Ошибка: ' + data.message;
                    }
                })
                .catch(err => {
                    uploadMessage.classList.remove('hidden');
                    uploadMessage.className = 'error';
                    uploadMessage.textContent = '❌ Ошибка соединения: ' + err.message;
                });
            };
            reader.readAsText(file);
        });

        // --- События ---
        downloadBtn.addEventListener('click', downloadManifest);

        // --- Загружаем данные при старте ---
        loadManifest();
    })();
</script>
</body>
</html>
