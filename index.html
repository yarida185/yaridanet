<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaridaNet</title>
    <!-- Фавикон удалён -->
    <meta property="og:title" content="YaridaNet">
    <meta property="og:description" content="Страница с ссылками на проекты YaridaNet">
    <meta property="og:image" content="/preview-default.png">
    <meta property="og:url" content="https://yaridanet.c6t.ru/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="YaridaNet">
    <meta name="twitter:description" content="Страница с ссылками на проекты YaridaNet">
    <meta name="twitter:image" content="/preview-default.png">
    <style>
        /* Минимальный CSS для старых устройств, без эмодзи */
        body {
            background: #f0f0f0;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            padding: 0;
        }
        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #999;
            padding: 15px;
        }
        .header-title {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 10px;
        }
        .header-icon {
            display: none; /* скрываем, но можно удалить */
        }
        .links-grid {
            display: table;
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        .snail-card {
            float: left;
            width: 23%;
            margin: 1%;
            min-height: 180px;
            padding: 10px;
            border: 1px solid #ddd;
            background: #fafafa;
            vertical-align: top;
        }
        .clearfix::after {
            content: "";
            display: table;
            clear: both;
        }
        .card-emoji {
            font-size: 36px;
            text-align: center;
            /* если будет пусто, не отображать */
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin: 5px 0;
            border-bottom: 1px dotted #aaa;
            padding-bottom: 5px;
        }
        .card-description {
            font-size: 14px;
            margin: 10px 0;
            text-align: center;
        }
        .card-link {
            display: block;
            text-align: center;
            background: #e0e0e0;
            color: #000;
            text-decoration: none;
            padding: 6px 12px;
            border: 1px solid #999;
            margin: 10px auto 0;
            width: fit-content;
        }
        .card-link:hover {
            background: #ccc;
        }
        .preview-mode .snail-card {
            float: none;
            width: 80%;
            margin: 0 auto;
            display: block;
        }
        .preview-mode .other-cards {
            display: none;
        }
        .preview-note {
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            background: #eee;
            border: 1px solid #999;
        }
        .preview-note a {
            color: #00c;
        }
        .error-fallback {
            border: 2px solid #c00;
            background: #fee;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }
        .footer-info {
            text-align: center;
            margin-top: 30px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 14px;
        }
        .footer-info span {
            margin: 0 6px;
        }
        .back-link {
            display: inline-block;
            margin-top: 10px;
            background: #e0e0e0;
            padding: 5px 15px;
            border: 1px solid #999;
            text-decoration: none;
            color: #000;
        }
        .back-link:hover {
            background: #ccc;
        }
        .loading-message {
            text-align: center;
            padding: 30px;
            background: #eee;
            border: 1px solid #ccc;
            font-size: 18px;
        }
        @media screen and (max-width: 700px) {
            .snail-card { width: 46%; margin: 2%; }
        }
        @media screen and (max-width: 450px) {
            .snail-card { width: 96%; margin: 2%; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-title">
        YaridaNet
    </div>

    <div id="snail-links-container">
        <div class="loading-message">[ Загрузка... ]</div>
    </div>

    <div class="footer-info">
        <span>Yarida</span> <span>|</span> <span>Net</span>
    </div>
</div>

<script>
    (function() {
        var container = document.getElementById('snail-links-container');
        var dataUrl = 'https://yaridanet.c6t.ru/homeconfig.txt';
        var body = document.body;

        function getRequestedLink() {
            var params = window.location.search;
            if (params.indexOf('?') === 0) {
                var parts = params.substring(1).split('&');
                for (var i = 0; i < parts.length; i++) {
                    var kv = parts[i].split('=');
                    if (kv[0] === 'link') return decodeURIComponent(kv[1]);
                }
            }
            return null;
        }

        function updateMetaTags(title, description, imageUrl) {
            var ogTitle = document.querySelector('meta[property="og:title"]');
            var ogDesc = document.querySelector('meta[property="og:description"]');
            var ogImage = document.querySelector('meta[property="og:image"]');
            var twTitle = document.querySelector('meta[name="twitter:title"]');
            var twDesc = document.querySelector('meta[name="twitter:description"]');
            var twImage = document.querySelector('meta[name="twitter:image"]');
            if (ogTitle) ogTitle.setAttribute('content', title);
            if (ogDesc) ogDesc.setAttribute('content', description);
            if (ogImage) ogImage.setAttribute('content', imageUrl || '/preview-default.png');
            if (twTitle) twTitle.setAttribute('content', title);
            if (twDesc) twDesc.setAttribute('content', description);
            if (twImage) twImage.setAttribute('content', imageUrl || '/preview-default.png');
            document.title = title;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function buildCard(item, isPreview) {
            // pic по умолчанию – пустая строка (без эмодзи)
            var pic = item.pic || '';
            var link = item.link || '#';
            var name = item.name || 'без имени';
            var des = item.des || 'проект без описания';

            var card = document.createElement('div');
            card.className = 'snail-card';
            if (!isPreview) card.classList.add('other-cards');

            var picHtml = pic ? '<div class="card-emoji">' + escapeHtml(pic) + '</div>' : '';
            card.innerHTML = 
                picHtml +
                '<div class="card-name">' + escapeHtml(name) + '</div>' +
                '<div class="card-description">' + escapeHtml(des) + '</div>' +
                '<a href="' + escapeHtml(link) + '" class="card-link" target="_blank" rel="noopener noreferrer">Перейти</a>';
            return card;
        }

        function renderItems(parsedItems, requestedLink) {
            if (requestedLink) {
                var norm = requestedLink.toLowerCase().trim();
                var foundItem = null;
                for (var i = 0; i < parsedItems.length; i++) {
                    var itemName = (parsedItems[i].name || '').toLowerCase().trim();
                    if (itemName.indexOf(norm) !== -1 || norm.indexOf(itemName) !== -1) {
                        foundItem = parsedItems[i];
                        break;
                    }
                }

                if (foundItem) {
                    body.classList.add('preview-mode');
                    container.innerHTML = '';

                    var grid = document.createElement('div');
                    grid.className = 'links-grid clearfix';
                    grid.appendChild(buildCard(foundItem, true));

                    var note = document.createElement('div');
                    note.className = 'preview-note';
                    note.innerHTML = '[ Предпросмотр: ' + escapeHtml(foundItem.name) + ' ]<br><a href="https://yaridanet.c6t.ru/" class="back-link">&lt;- Ко всем страницам</a>';
                    container.appendChild(note);
                    container.appendChild(grid);

                    updateMetaTags('YaridaNet - ' + foundItem.name, foundItem.des || 'проект YaridaNet', '/preview-default.png');
                } else {
                    container.innerHTML = 
                        '<div class="error-fallback">' +
                        '<p><strong>Страница не найдена</strong></p>' +
                        '<p>«' + escapeHtml(requestedLink) + '» отсутствует</p>' +
                        '<p style="font-size:14px;">попробуйте другую ссылку</p>' +
                        '<a href="https://yaridanet.c6t.ru/" class="back-link">&lt;- Ко всем страницам</a>' +
                        '</div>';
                    updateMetaTags('YaridaNet - страница не найдена', 'запрашиваемая страница отсутствует');
                }
            } else {
                container.innerHTML = '';
                var grid = document.createElement('div');
                grid.className = 'links-grid clearfix';
                for (var j = 0; j < parsedItems.length; j++) {
                    grid.appendChild(buildCard(parsedItems[j], false));
                }
                container.appendChild(grid);
                updateMetaTags('YaridaNet', 'Страница с ссылками на проекты YaridaNet', '/preview-default.png');
            }
        }

        // Загрузка данных
        var xhr = new XMLHttpRequest();
        xhr.open('GET', dataUrl, true);
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    var rawText = xhr.responseText;
                    if (!rawText || rawText.trim().length === 0) {
                        showError('Файл пуст');
                        return;
                    }

                    var items = rawText.split('!').filter(function(part) { return part.trim() !== ''; });
                    var parsedItems = [];
                    for (var i = 0; i < items.length; i++) {
                        try {
                            var jsonItem = JSON.parse(items[i].trim());
                            if (jsonItem && typeof jsonItem === 'object') parsedItems.push(jsonItem);
                        } catch (e) {
                            console.warn('JSON parse error:', items[i]);
                        }
                    }
                    if (parsedItems.length === 0) {
                        showError('Нет валидных данных');
                        return;
                    }

                    var requestedLink = getRequestedLink();
                    renderItems(parsedItems, requestedLink);
                } else {
                    showError('HTTP ' + xhr.status);
                }
            }
        };
        xhr.send();

        function showError(msg) {
            container.innerHTML = 
                '<div class="error-fallback">' +
                '<p><strong>Ошибка загрузки</strong></p>' +
                '<p style="font-size:14px;">' + escapeHtml(msg) + '</p>' +
                '<a href="https://yaridanet.c6t.ru/" class="back-link">&lt;- Ко всем страницам</a>' +
                '</div>';
            updateMetaTags('YaridaNet - ошибка', 'не удалось загрузить данные');
        }
    })();
</script>

</body>
</html>
