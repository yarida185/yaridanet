<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaridaNet</title>
    <link rel="icon" type="image/png" href="https://yaridanet.c6t.ru/icon.png">
    <meta property="og:title" content="YaridaNet">
    <meta property="og:description" content="Страница с ссылками на проекты YaridaNet">
    <meta property="og:image" content="/preview-default.png">
    <meta property="og:url" content="https://yaridanet.c6t.ru/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="YaridaNet">
    <meta name="twitter:description" content="Страница с ссылками на проекты YaridaNet">
    <meta name="twitter:image" content="/preview-default.png">
    <style>
        /* СКЕВОМОРФИЗМ — чистый, без улиток */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
            background: #1f2e1f;
            background-image: 
                radial-gradient(circle at 20% 30%, #3a5a3a, #152215 90%),
                repeating-linear-gradient(45deg, rgba(60,90,50,0.08) 0px, rgba(60,90,50,0.08) 4px, transparent 4px, transparent 8px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            position: relative;
            color: #eef7dd;
        }

        /* лёгкая текстура, без улиток */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.09 0 0 0 0 0.05 0 0 0 0.15 0"/></filter><rect width="100" height="100" filter="url(%23n)"/></svg>');
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        .main-container {
            max-width: 1100px;
            width: 100%;
            background: #2f4d2f;
            background-image: radial-gradient(circle at 10% 20%, #4b734b, #1e3a1e);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 
                0 30px 40px -10px rgba(0,0,0,0.8),
                0 0 0 6px #6f9465,
                0 0 0 12px #3f623f,
                inset 0 -8px 0 #1f3a1f,
                inset 0 8px 12px rgba(180, 220, 140, 0.25);
            padding: 3rem 2.5rem;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
            border: 2px solid #aacb92;
            transform: rotate(0.2deg);
            transition: transform 0.2s ease;
        }

        .main-container:hover {
            transform: rotate(0deg) scale(1.003);
        }

        /* заголовок с "выдавленным" эффектом */
        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem 1.8rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            font-size: 3.6rem;
            font-weight: 900;
            text-shadow: 
                0 4px 0 #163016,
                0 8px 8px rgba(0,0,0,0.6),
                0 12px 20px rgba(0,0,0,0.3);
            color: #eaf5ce;
            letter-spacing: 2px;
            background: rgba(40, 70, 40, 0.3);
            padding: 0.3rem 2rem;
            border-radius: 120px;
            box-shadow: inset 0 -6px 0 #355a35, inset 0 4px 10px #8bb580;
            backdrop-filter: blur(4px);
            border: 1px solid #9fc485;
            transform: perspective(400px) rotateX(1deg);
        }

        .header-icon {
            font-size: 3.2rem;
            filter: drop-shadow(0 8px 6px #0a1a0a);
            transform: rotate(0deg) scale(1);
            transition: 0.2s;
            display: inline-block;
        }

        .header-icon:hover {
            transform: rotate(6deg) scale(1.15);
            filter: drop-shadow(0 12px 10px #0a1a0a);
        }

        /* Режим предпросмотра */
        .preview-mode .links-grid {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 350px;
        }

        .preview-mode .snail-card {
            max-width: 420px;
            width: 100%;
            margin: 0 auto;
            transform: scale(1.08) rotate(0.5deg);
            box-shadow: 
                0 20px 30px -5px #0a1a0a,
                0 0 0 6px #cde8b0,
                0 0 0 12px #3f6d3f,
                inset 0 -8px 0 #1f3f1f,
                inset 0 8px 20px #aad48a;
        }

        .preview-mode .other-cards {
            display: none;
        }

        .preview-note {
            text-align: center;
            margin: 2rem 0 1.5rem;
            padding: 1.2rem;
            background: #325732;
            border-radius: 80px;
            border: 3px solid #8fb87c;
            box-shadow: inset 0 -6px 0 #1a341a, 0 8px 16px #0a1a0a;
            color: #edffcb;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        .preview-note a {
            color: #f5efb8;
            text-decoration: underline wavy #aad48a;
            text-shadow: 0 2px 0 #2a4f2a;
        }

        /* СЕТКА КАРТОЧЕК — скевоморфные карточки */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 2rem;
            margin: 2.8rem 0 1.5rem;
            transition: 0.3s;
        }

        .snail-card {
            background: #2e572e;
            background-image: radial-gradient(circle at 30% 40%, #4a7a4a, #1e3f1e);
            border-radius: 40px 40px 30px 30px;
            padding: 1.8rem 1.4rem 1.4rem;
            border: 3px solid #7ead74;
            box-shadow: 
                0 16px 20px -8px #0a1a0a,
                0 0 0 5px #4f7a4f,
                inset 0 -8px 0 #1a341a,
                inset 0 8px 20px rgba(160, 210, 120, 0.25);
            transition: all 0.18s ease;
            transform: rotate(0.5deg);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .snail-card:hover {
            background: #3f6f3f;
            transform: translateY(-10px) rotate(0deg) scale(1.02);
            border-color: #cce8ae;
            box-shadow: 
                0 28px 30px -8px #0a1a0a,
                0 0 0 6px #bae096,
                inset 0 -6px 0 #1f3f1f,
                inset 0 10px 30px #b8df98;
            border-radius: 48px 48px 36px 36px;
        }

        .card-emoji {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 0.4rem;
            text-align: center;
            filter: drop-shadow(0 8px 6px #0a1a0a);
            transform: scale(1) rotate(0deg);
            transition: 0.2s;
        }

        .snail-card:hover .card-emoji {
            transform: scale(1.12) rotate(4deg);
            filter: drop-shadow(0 10px 8px #0a1a0a);
        }

        .card-name {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            color: #f3ffd8;
            text-shadow: 0 4px 0 #1f471f, 0 6px 10px #0a1a0a;
            margin-bottom: 0.3rem;
            word-break: break-word;
            letter-spacing: 1px;
            border-bottom: 4px dotted #7aac6a;
            padding-bottom: 0.5rem;
        }

        .card-description {
            font-size: 1rem;
            color: #def0c0;
            margin: 0.8rem 0 1.4rem;
            line-height: 1.5;
            text-align: center;
            background: #355f35;
            padding: 0.7rem 0.6rem;
            border-radius: 30px;
            border: 2px solid #6fa565;
            box-shadow: inset 0 -4px 0 #1a3a1a, inset 0 4px 10px #86b574;
        }

        .card-link {
            display: inline-block;
            background: #88b07c;
            background-image: linear-gradient(145deg, #a8d094, #73a068);
            color: #132813;
            text-decoration: none;
            font-weight: 800;
            padding: 0.7rem 1.8rem;
            border-radius: 60px;
            font-size: 1.15rem;
            border: 3px solid #c6e8aa;
            box-shadow: 0 8px 0 #1f471f, inset 0 2px 8px #e8ffcc;
            transition: 0.08s linear;
            text-align: center;
            margin-top: auto;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            letter-spacing: 0.5px;
            transform: translateY(-2px);
        }

        .card-link:hover {
            background: #badea6;
            background-image: linear-gradient(145deg, #cef0b4, #9ac484);
            transform: translateY(-6px);
            box-shadow: 0 12px 0 #1a3f1a, inset 0 2px 12px #f2ffd8;
            color: #0a200a;
            border-color: #e4ffc4;
        }

        .card-link:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #1a3f1a;
        }

        .error-fallback {
            background: #4a3d2e;
            background-image: radial-gradient(circle, #66553e, #3a2f22);
            border: 6px double #a8bc7a;
            border-radius: 60px;
            padding: 2.5rem 2rem;
            text-align: center;
            font-size: 1.5rem;
            margin: 2rem 0;
            color: #f5ecc0;
            box-shadow: inset 0 -12px 0 #2a2218, 0 20px 30px #0a150a;
            transform: rotate(0.3deg);
        }

        .footer-info {
            margin-top: 3.5rem;
            display: flex;
            justify-content: center;
            gap: 1rem 2.5rem;
            flex-wrap: wrap;
            font-size: 1.2rem;
            color: #b8d8a3;
            border-top: 4px solid #5a845a;
            padding-top: 2rem;
            opacity: 0.85;
            text-shadow: 0 4px 4px #0a1a0a;
            background: rgba(30, 60, 30, 0.15);
            border-radius: 80px;
            backdrop-filter: blur(4px);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .footer-info span {
            filter: drop-shadow(0 6px 6px #0a1a0a);
            transition: 0.2s;
            cursor: default;
        }

        .footer-info span:hover {
            transform: scale(1.08);
            color: #e8ffcd;
        }

        .back-link {
            display: inline-block;
            margin-top: 1rem;
            color: #cce6b0;
            text-decoration: none;
            border: 3px solid #79a56f;
            padding: 0.6rem 2rem;
            border-radius: 60px;
            background: #285028;
            box-shadow: inset 0 -6px 0 #163016, 0 8px 12px #0a1a0a;
            transition: 0.15s;
            font-weight: 600;
        }

        .back-link:hover {
            background: #356a35;
            color: #f5efc0;
            border-color: #b6db98;
            transform: scale(1.02);
            box-shadow: inset 0 -4px 0 #163016, 0 12px 16px #061006;
        }

        @media (max-width: 600px) {
            .main-container { padding: 1.5rem 1rem; }
            .header-title { font-size: 2.4rem; padding: 0.3rem 0.8rem; }
            .card-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-title">
        <span class="header-icon">✦</span>
        <span style="background: transparent; filter: none; letter-spacing: 2px;">YaridaNet</span>
        <span class="header-icon">✦</span>
    </div>

    <!-- КОНТЕЙНЕР СПИСКА ССЫЛОК -->
    <div id="snail-links-container">
        <!-- Содержимое будет загружено через JavaScript -->
        <div class="loading-message" style="text-align:center; padding:2rem; background:#2f522f; border-radius:60px; border:3px solid #8fb87c; box-shadow:inset 0 -6px 0 #1a341a;">
            <span style="font-size:2rem;">⏳</span> загрузка страниц...
        </div>
    </div>

    <div class="footer-info">
        <span>✦</span><span>YaridaNet</span><span>✦</span><span>зелёные проекты</span><span>✦</span>
    </div>
</div>

<script>
    (function() {
        const container = document.getElementById('snail-links-container');
        const dataUrl = 'https://yaridanet.c6t.ru/homeconfig.txt';
        const body = document.body;

        function getRequestedLink() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('link');
        }

        function updateMetaTags(title, description, imageUrl = '/preview-default.png') {
            document.querySelector('meta[property="og:title"]')?.setAttribute('content', title);
            document.querySelector('meta[property="og:description"]')?.setAttribute('content', description);
            document.querySelector('meta[property="og:image"]')?.setAttribute('content', imageUrl);
            document.querySelector('meta[name="twitter:title"]')?.setAttribute('content', title);
            document.querySelector('meta[name="twitter:description"]')?.setAttribute('content', description);
            document.querySelector('meta[name="twitter:image"]')?.setAttribute('content', imageUrl);
            document.title = title;
        }

        function buildCard(item, isPreview = false) {
            const pic = item.pic || '📄';
            const link = item.link || '#';
            const name = item.name || 'без имени';
            const des = item.des || 'проект без описания';

            const card = document.createElement('div');
            card.className = 'snail-card';
            if (!isPreview) card.classList.add('other-cards');

            card.innerHTML = `
                <div class="card-emoji">${escapeHtml(pic)}</div>
                <div class="card-name">${escapeHtml(name)}</div>
                <div class="card-description">${escapeHtml(des)}</div>
                <a href="${escapeHtml(link)}" class="card-link" target="_blank" rel="noopener noreferrer">➜ Перейти</a>
            `;
            return card;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        fetch(dataUrl, { cache: "no-store" })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return response.text();
            })
            .then(rawText => {
                if (!rawText || rawText.trim().length === 0) throw new Error('Файл пуст');

                const items = rawText.split('!').filter(part => part.trim() !== '');
                const parsedItems = [];
                for (let piece of items) {
                    try {
                        const jsonItem = JSON.parse(piece.trim());
                        if (jsonItem && typeof jsonItem === 'object') parsedItems.push(jsonItem);
                    } catch (e) { console.warn('JSON parse error:', piece); }
                }
                if (parsedItems.length === 0) throw new Error('Нет валидных данных');

                const requestedLink = getRequestedLink();
                if (requestedLink) {
                    const norm = requestedLink.toLowerCase().trim();
                    let foundItem = null;
                    for (const item of parsedItems) {
                        const itemName = (item.name || '').toLowerCase().trim();
                        if (itemName.includes(norm) || norm.includes(itemName)) {
                            foundItem = item;
                            break;
                        }
                    }

                    if (foundItem) {
                        body.classList.add('preview-mode');
                        container.innerHTML = '';
                        const grid = document.createElement('div');
                        grid.className = 'links-grid';
                        grid.appendChild(buildCard(foundItem, true));

                        const previewNote = document.createElement('div');
                        previewNote.className = 'preview-note';
                        previewNote.innerHTML = `
                            ✦ предпросмотр страницы «${escapeHtml(foundItem.name)}»<br>
                            <a href="https://yaridanet.c6t.ru/" class="back-link">← ко всем страницам</a>
                        `;
                        container.appendChild(previewNote);
                        container.appendChild(grid);

                        updateMetaTags(
                            `YaridaNet · ${foundItem.name}`,
                            foundItem.des || 'проект YaridaNet',
                            '/preview-default.png'
                        );
                    } else {
                        container.innerHTML = `
                            <div class="error-fallback">
                                <div style="font-size:3rem;">❓</div>
                                <p>страница «${escapeHtml(requestedLink)}» не найдена</p>
                                <p style="font-size:1rem;">попробуйте другую ссылку</p>
                                <a href="https://yaridanet.c6t.ru/" class="back-link">← ко всем страницам</a>
                                <div style="font-size:2rem; margin-top:1rem;">✦ ✦ ✦</div>
                            </div>
                        `;
                        updateMetaTags('YaridaNet · страница не найдена', 'запрашиваемая страница отсутствует');
                    }
                } else {
                    container.innerHTML = '';
                    const grid = document.createElement('div');
                    grid.className = 'links-grid';
                    parsedItems.forEach(item => grid.appendChild(buildCard(item)));
                    container.appendChild(grid);
                    updateMetaTags('YaridaNet', 'Страница с ссылками на проекты YaridaNet');
                }
            })
            .catch(error => {
                console.error(error);
                container.innerHTML = `
                    <div class="error-fallback">
                        <div style="font-size:3rem;">⚠️</div>
                        <p>не удалось загрузить список страниц</p>
                        <p style="font-size:1rem;">ошибка: ${escapeHtml(error.message)}</p>
                        <a href="https://yaridanet.c6t.ru/" class="back-link">← ко всем страницам</a>
                        <div style="font-size:2rem; margin-top:1rem;">✦ ✦ ✦</div>
                    </div>
                `;
                updateMetaTags('YaridaNet · ошибка', 'не удалось загрузить данные');
            });
    })();
</script>

</body>
</html>
